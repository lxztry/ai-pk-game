        * { margin: 0; padding: 0; box-sizing: border-box; }

        label { display: block; margin-bottom: 4px; font-size: 13px; opacity: 0.9; }

            width: 100%; padding: 8px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.3);

        .settings {

            border-radius: 12px; padding: 18px; margin-bottom: 20px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;

            background: linear-gradient(135deg, #fbbf24, #f97316);
            border: none; padding: 14px 40px; border-radius: 8px;
            color: white; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: all 0.2s;

        button:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 4px 20px rgba(251,191,36,0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .actions { text-align: center; }

        .replay-frame { margin-top: 20px; }
        .replay-frame iframe {

        .badge {

        }

        <div class="settings" data-page-node-id="IhS53nh4AK4wpFNewFdJed">

            <iframe id="replay-iframe" data-page-node-id="7lChE9RR8ywGDDyoaxm0Do"></iframe>

    <script>
        const PRESETS = {
            aggressive: '你是激进的战斗特工。规则：\n1. 视野里有敌人立即射击\n2. 没敌人时朝敌人方向冲锋\n3. 血量 < 20 才考虑逃跑',
            defensive: '你是谨慎的战斗特工。规则：\n1. 距离敌人 > 15 才射击，避免近战\n2. 持续移动，不 idle\n3. 血量 < 50 立刻远离敌人',
            sniper: '你是狙击手型特工。规则：\n1. 远距离优先，保持距离\n2. 一旦瞄准就射击\n3. 血量 < 40 找掩体',
        };
        function setPreset(side, persona) {
            document.getElementById('prompt-' + side).value = PRESETS[persona];
            document.getElementById('persona-' + side).value = persona;
            updateBadges();
        }
        function updateBadges() {
            document.getElementById('badge-a').textContent = document.getElementById('persona-a').value;
            document.getElementById('badge-b').textContent = document.getElementById('persona-b').value;
        }
        document.getElementById('persona-a').onchange = updateBadges;
        document.getElementById('persona-b').onchange = updateBadges;

        async function loadProviders() {
            try {
                const r = await fetch('/api/llm-providers');
                const data = await r.json();
                const sel = document.getElementById('provider');
                const info = document.getElementById('providers-info');
                const lines = ['<b>支持的 LLM：</b><br>'];
                data.providers.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.textContent = `${p.name} (${p.default_model})`;
                    sel.appendChild(opt);
                    lines.push(`• <b>${p.name}</b>: ${p.api_key_env} → ${p.default_model}<br>`);
                });
                info.innerHTML = lines.join('');
            } catch (e) {
                document.getElementById('providers-info').textContent = '加载 provider 失败: ' + e.message;
            }
        }

        async function startDuel() {
            const btn = document.getElementById('duel-btn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.className = 'status running';
            status.innerHTML = '⏳ 正在调用 LLM 并跑对决...';

            const payload = {
                player1: {
                    name: document.getElementById('name-a').value || 'A',
                    prompt: document.getElementById('prompt-a').value,
                    persona: document.getElementById('persona-a').value,
                },
                player2: {
                    name: document.getElementById('name-b').value || 'B',
                    prompt: document.getElementById('prompt-b').value,
                    persona: document.getElementById('persona-b').value,
                },
                provider: document.getElementById('provider').value,
                api_key: document.getElementById('api-key').value || null,
                model: document.getElementById('model').value || null,
                map_size: parseInt(document.getElementById('map-size').value),
                max_turns: 100,
                shotgun_duel: true,
            };

            try {
                const r = await fetch('/api/duel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error || '请求失败');

                status.className = 'status completed';
                status.innerHTML = `
                    <h2>🏆 ${data.winner || '平局'} 获胜！</h2>
                    <p>${data.player1.name}: 血 ${data.player1.health} 杀 ${data.player1.kills}</p>
                    <p>${data.player2.name}: 血 ${data.player2.health} 杀 ${data.player2.kills}</p>
                    <p>回合数: ${data.turns} | Provider: ${data.provider}</p>
                `;

                if (data.replay_url) {
                    const frame = document.getElementById('replay-frame');
                    frame.style.display = 'block';
                    document.getElementById('replay-iframe').src = data.replay_url;
                }
            } catch (e) {
                status.className = 'status error';
                status.innerHTML = '❌ ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        loadProviders();
        updateBadges();
    </script>
</body>
