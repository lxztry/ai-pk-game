<title>3v3 团队战 · 战境 TACTICA</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', sans-serif;
  background: #060b14;
  color: #e9f0ff;
  min-height: 100vh;
  overflow: hidden;
}
.app-shell {
  position: relative;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 30% 20%, rgba(31, 91, 130, .14), transparent 28%),
    linear-gradient(145deg, #070d17 0%, #080e18 52%, #050912 100%);
}
.ambient { position: fixed; border-radius: 999px; filter: blur(90px); opacity: .11; pointer-events: none; }
.ambient-one { width: 380px; height: 380px; left: -150px; top: 20%; background: #22d3ee; }
.ambient-two { width: 320px; height: 320px; right: -130px; bottom: -60px; background: #a78bfa; }

/* 顶栏 */
.topbar {
  height: 70px;
  padding: 0 24px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid rgba(145, 168, 205, .14);
  background: rgba(6, 11, 20, .82);
  backdrop-filter: blur(16px);
  position: relative;
  z-index: 3;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  display: grid; place-items: center; width: 40px; height: 40px;
  color: #22d3ee; border: 1px solid rgba(34,211,238,.35);
  background: rgba(34,211,238,.12);
  clip-path: polygon(20% 0, 80% 0, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0 80%, 0 20%);
  font-size: 20px;
}
.brand-name { font-weight: 800; letter-spacing: .12em; font-size: 16px; }
.brand-name span { color: #22d3ee; font-size: 10px; margin-left: 4px; }
.brand-subtitle { color: #75829a; font-size: 10px; letter-spacing: .2em; margin-top: 2px; }

.match-score { display: flex; align-items: center; gap: 24px; }
.team-score { display: flex; align-items: center; gap: 10px; }
.team-score strong { font-size: 26px; font-weight: 800; }
.team-score.blue strong { color: #22d3ee; text-shadow: 0 0 18px rgba(34,211,238,.5); }
.team-score.red strong { color: #fb6470; text-shadow: 0 0 18px rgba(251,100,112,.4); }
.team-label { font-size: 12px; color: #aab5c9; }
.vs { color: #75829a; font-size: 14px; font-weight: 700; padding: 0 4px; }
.match-clock {
  min-width: 140px; text-align: center; padding: 6px 18px;
  border-left: 1px solid rgba(145, 168, 205, .14);
  border-right: 1px solid rgba(145, 168, 205, .14);
}
.match-clock .label { display: block; color: #75829a; font-size: 9px; letter-spacing: .08em; }
.match-clock .time { font-size: 18px; font-weight: 800; letter-spacing: .04em; }

.header-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.icon-button {
  display: grid; place-items: center; width: 34px; height: 34px;
  border-radius: 8px; color: #8290a8; border: 1px solid rgba(145,168,205,.14);
  background: rgba(255,255,255,.025); cursor: pointer; font-size: 14px;
}
.icon-button:hover { color: #22d3ee; border-color: rgba(34,211,238,.35); }

/* 3 栏布局 */
.battle-layout {
  height: calc(100vh - 70px);
  display: grid;
  grid-template-columns: 280px 1fr 340px;
  gap: 1px;
  background: rgba(145, 168, 205, .14);
  position: relative;
  z-index: 2;
}
.panel, .battle-stage { background: rgba(7, 12, 22, .93); }
.panel { padding: 18px 16px; overflow-y: auto; }
.panel-heading { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.eyebrow { color: #22d3ee; font-size: 9px; letter-spacing: .18em; font-weight: 600; }
.heading-text { font-weight: 700; font-size: 14px; margin-top: 2px; }
.panel-tag { font-size: 9px; color: #75829a; }

/* 左栏：英雄卡 */
.hero-list { display: grid; gap: 8px; margin-bottom: 16px; }
.hero-card {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border: 1px solid rgba(145,168,205,.08);
  border-radius: 10px;
  background: rgba(255,255,255,.02);
  transition: all .2s;
}
.hero-card.dead { opacity: .35; filter: grayscale(.8); }
.hero-card.blue-card { border-left: 3px solid #22d3ee; }
.hero-card.red-card { border-left: 3px solid #fb6470; }
.hero-portrait {
  flex: 0 0 36px; width: 36px; height: 40px;
  display: grid; place-items: center;
  border-radius: 6px 6px 10px 6px;
  font-weight: 800; color: #08121d; font-size: 16px;
}
.hero-portrait.cyan { background: linear-gradient(145deg, #a5f3fc, #0891b2); }
.hero-portrait.violet { background: linear-gradient(145deg, #ddd6fe, #7c3aed); color: white; }
.hero-portrait.gold { background: linear-gradient(145deg, #fef3c7, #d97706); }
.hero-portrait.green { background: linear-gradient(145deg, #bbf7d0, #059669); }
.hero-portrait.red-grad { background: linear-gradient(145deg, #fecaca, #dc2626); }
.hero-portrait.pink { background: linear-gradient(145deg, #fbcfe8, #db2777); }
.hero-portrait.orange { background: linear-gradient(145deg, #fed7aa, #ea580c); }
.hero-info { flex: 1; min-width: 0; }
.hero-title { display: flex; justify-content: space-between; align-items: center; }
.hero-name { font-size: 12px; font-weight: 700; }
.hero-kda { font-size: 9px; color: #75829a; }
.hero-stats { display: flex; gap: 6px; font-size: 10px; margin-top: 4px; }
.hero-stats .kills { color: #39daa0; }
.hero-stats .deaths { color: #fb6470; }
.hero-stats .streak { color: #f2c75c; }
.hp-track { height: 3px; border-radius: 9px; background: #20293a; overflow: hidden; margin-top: 4px; }
.hp-track > span { display: block; height: 100%; transition: width .3s; }
.hp-blue > span { background: linear-gradient(90deg, #39daa0, #22d3ee); }
.hp-red > span { background: linear-gradient(90deg, #fb6470, #f2c75c); }
.hero-skill { font-size: 9px; color: #75829a; margin-top: 4px; font-style: italic; }
.hero-skill.ready { color: #f2c75c; }

/* 武器标签 */
.weapon-tag {{
  display: inline-flex; align-items: center; gap: 2px;
  padding: 1px 5px; border-radius: 3px;
  font-size: 9px; font-weight: 700;
}}
/* 弹药条 */
.ammo-track {{
  position: relative; height: 4px; border-radius: 2px;
  background: #1a2333; overflow: hidden; margin-top: 3px;
}}
.ammo-fill {{
  height: 100%; background: linear-gradient(90deg, #f59e0b, #fbbf24);
  transition: width .3s;
}}
.ammo-label {{
  position: absolute; right: 0; top: -1px;
  font-size: 8px; color: #fcd34d; font-weight: 700;
}}
/* 护盾条 */
.shield-track {{
  height: 3px; border-radius: 9px; background: #1a2333;
  overflow: hidden; margin-top: 2px;
}}
.shield-track > span {{
  display: block; height: 100%;
  background: linear-gradient(90deg, #60a5fa, #93c5fd);
}}
/* 模式选择器 */
.mode-chips {{
  display: flex; gap: 4px; margin: 8px 0;
}}
.mode-chip {{
  flex: 1; padding: 6px 8px; font-size: 11px; font-weight: 700;
  background: rgba(255,255,255,.04); border: 1px solid rgba(145,168,205,.12);
  color: #aab5c9; border-radius: 6px; cursor: pointer;
}}
.mode-chip.active {{
  background: linear-gradient(135deg, #22d3ee, #3b82f6);
  color: white; border-color: #22d3ee;
}}
.mode-chip:hover {{ background: rgba(34,211,238,.12); }}
/* 速度按钮（用 speed-btn 类避免和 mode-chip 冲突）*/
.speed-btn {{
  padding: 3px 10px; font-size: 10px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(145,168,205,.14);
  color: #aab5c9; border-radius: 4px; cursor: pointer;
}}
.speed-btn.active {{ background: #22d3ee; color: #060b14; border-color: #22d3ee; }}
.resource-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 12px; margin-top: 10px;
  border: 1px solid rgba(145,168,205,.08);
  border-radius: 10px;
  background: rgba(255,255,255,.02);
}
.resource-cell { text-align: center; }
.resource-cell .label { font-size: 9px; color: #75829a; }
.resource-cell .value { font-size: 18px; font-weight: 800; margin-top: 2px; }
.resource-cell .value.blue-c { color: #22d3ee; }
.resource-cell .value.red-c { color: #fb6470; }

/* 中栏：战场 */
.battle-stage { display: flex; flex-direction: column; position: relative; }
.stage-toolbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 16px;
  border-bottom: 1px solid rgba(145,168,205,.1);
  background: rgba(6, 11, 20, .4);
}
.live-indicator { display: flex; align-items: center; font-size: 11px; color: #39daa0; }
.live-indicator::before {
  content: ''; width: 6px; height: 6px; background: #39daa0; border-radius: 50%;
  margin-right: 6px; box-shadow: 0 0 8px #39daa0;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
.speed-control { display: flex; gap: 4px; }

/* 战场 SVG 容器 */
.map-frame {
  flex: 1; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse at center, #0c1a2b 0%, #050912 100%);
}
#battle-svg { width: 100%; height: 100%; display: block; }

/* 事件流 + 速度 */
.stage-footer {
  padding: 10px 16px;
  border-top: 1px solid rgba(145,168,205,.1);
  background: rgba(6, 11, 20, .4);
  max-height: 200px; overflow-y: auto;
}
.event-line {
  display: flex; align-items: center; gap: 8px; font-size: 11px;
  padding: 4px 0; border-bottom: 1px solid rgba(145,168,205,.05);
}
.event-time { color: #75829a; font-size: 10px; min-width: 38px; }
.event-killer { color: #22d3ee; font-weight: 600; }
.event-victim { color: #fb6470; }
.event-arrow { color: #75829a; }
.event-streak { color: #f2c75c; font-weight: 700; margin-left: 6px; }

/* 右栏：AI 指挥 */
.ai-heading { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.ai-symbol {
  display: grid; place-items: center; width: 40px; height: 40px;
  border-radius: 50%; color: #22d3ee;
  background: linear-gradient(135deg, rgba(34,211,238,.18), rgba(167,139,250,.12));
  border: 1px solid rgba(34,211,238,.35);
  font-size: 20px;
}
.ai-status {
  display: flex; align-items: center; gap: 10px;
  padding: 12px; margin-bottom: 12px;
  background: rgba(34,211,238,.04);
  border: 1px solid rgba(34,211,238,.18);
  border-radius: 10px;
}
.pulse-dot {
  width: 8px; height: 8px; background: #39daa0; border-radius: 50%;
  box-shadow: 0 0 10px #39daa0;
  animation: pulse 1.5s ease-in-out infinite;
}
.ai-status .label { font-size: 12px; font-weight: 600; }
.ai-status .sublabel { font-size: 10px; color: #75829a; margin-top: 2px; }

/* 胜率预测 */
.win-prediction {
  padding: 14px; margin-bottom: 14px;
  background: linear-gradient(135deg, rgba(34,211,238,.06), rgba(167,139,250,.06));
  border: 1px solid rgba(34,211,238,.22);
  border-radius: 10px;
}
.win-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.win-top .label { font-size: 11px; color: #75829a; }
.win-rate { font-size: 28px; font-weight: 800; color: #22d3ee; }
.win-rate .delta { font-size: 11px; color: #39daa0; margin-left: 4px; }
.win-track { height: 6px; border-radius: 3px; background: rgba(0,0,0,.4); overflow: hidden; }
.win-track > div { height: 100%; background: linear-gradient(90deg, #fb6470 0%, #f2c75c 50%, #39daa0 100%); transition: width .4s; }

/* 策略输入 */
.prompt-area { margin-bottom: 12px; }
.prompt-area label { display: block; font-size: 11px; color: #75829a; margin-bottom: 6px; }
.prompt-box {
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(145,168,205,.14);
  border-radius: 10px;
  padding: 8px;
}
.prompt-box textarea {
  width: 100%; height: 60px; resize: none;
  background: transparent; border: none; color: #e9f0ff;
  font: inherit; font-size: 12px;
}
.prompt-box textarea:focus { outline: none; }
.prompt-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.prompt-footer .count { font-size: 9px; color: #75829a; }
.send-button {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 12px; font-size: 11px; font-weight: 600;
  background: linear-gradient(135deg, #22d3ee, #3b82f6);
  color: white; border: none; border-radius: 6px; cursor: pointer;
}
.send-button:disabled { opacity: .5; cursor: not-allowed; }
.send-button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,211,238,.35); }

/* 快速策略按钮 */
.strategy-chips { display: grid; gap: 6px; }
.strategy-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(145,168,205,.08);
  border-radius: 8px;
  color: #aab5c9; font-size: 11px; cursor: pointer; text-align: left;
}
.strategy-chip:hover { background: rgba(34,211,238,.08); border-color: rgba(34,211,238,.25); }
.chip-icon {
  width: 22px; height: 22px; display: grid; place-items: center;
  border-radius: 4px;
}
.chip-bolt { background: rgba(34,211,238,.18); color: #22d3ee; }
.chip-shield { background: rgba(57,218,160,.18); color: #39daa0; }
.chip-target { background: rgba(242,199,92,.18); color: #f2c75c; }

/* 飞过的解说气泡 */
.fly-bubble {
  position: absolute; left: 50%; top: 20px; transform: translateX(-50%);
  background: #fbbf24; color: #000;
  padding: 10px 20px; border-radius: 24px;
  font-size: 18px; font-weight: 800;
  box-shadow: 0 8px 30px rgba(251,191,36,.6);
  animation: bubbleIn 0.4s ease-out;
  z-index: 10;
  pointer-events: none;
}
@keyframes bubbleIn { from { transform: translateX(-50%) translateY(-30px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: rgba(145,168,205,.2); border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }
</style>

function switchMode(mode) {
  currentMode = mode;

  TOTAL = FRAMES.length;
  FINAL_BLUE = ALL_MODES[mode].final_blue;
  FINAL_RED = ALL_MODES[mode].final_red;

  N_BLUE = HERO_META.filter(h => h.side === 'blue').length;

  currentFrame = 0;
  document.querySelectorAll('.mode-chip').forEach(b => b.classList.remove('active'));

function renderHeroes() {
  const blueList = document.getElementById('blue-hero-list');
  const redList = document.getElementById('red-hero-list');
  const f = getFrame();
  let blueH = '', redH = '';
  for (let i = 0; i < HERO_META.length; i++) {
    const m = HERO_META[i];
    const hp = f.healths[i];
    const ammo = f.ammos ? f.ammos[i] : m.max_ammo;
    const shield = f.shields ? f.shields[i] : 0;
    const kills = f.kills[i];
    const deaths = f.deaths[i];
    const pct = Math.max(0, Math.min(100, (hp / m.max_hp) * 100));
    const ammoPct = Math.max(0, Math.min(100, (ammo / m.max_ammo) * 100));
    const dead = hp <= 0;
    const cls = m.side === 'blue' ? 'blue-card' : 'red-card';
    const sideColor = m.side === 'blue' ? '#3b82f6' : '#ef4444';
    const html = `<div class="hero-card ${cls} ${dead?'dead':''}">
      <div class="hero-portrait ${m.color}">${m.icon}</div>
      <div class="hero-info">
        <div class="hero-title">
          <span class="hero-name">${m.name}</span>
          <span class="weapon-tag" style="background:${m.weapon_color}22;color:${m.weapon_color};">${m.weapon_icon}${m.weapon_name}</span>
        </div>
        <div class="hp-track ${m.side==='blue'?'hp-blue':'hp-red'}"><span style="width:${pct}%"></span></div>
        ${shield > 0 ? `<div class="shield-track"><span style="width:${Math.min(100, shield*3.33)}%"></span></div>` : ''}
        <div class="ammo-track" title="弹药"><div class="ammo-fill" style="width:${ammoPct}%"></div><span class="ammo-label">${Math.round(ammo)}/${m.max_ammo}</span></div>
        <div class="hero-stats">
          <span class="kills">杀 ${kills}</span>
          <span class="deaths">死 ${deaths}</span>
          <span>·</span>
          <span>${m.lane.toUpperCase()}路</span>
        </div>
      </div>
    </div>`;
    if (m.side === 'blue') blueH += html; else redH += html;
  }
  blueList.innerHTML = blueH;
  redList.innerHTML = redH;
}

    html += `<circle cx="${px}" cy="${py}" r="14" fill="url(#hero${i})" stroke="${sideColorDark}" stroke-width="2.5"/>`;
    html += `<text x="${px}" y="${py+5}" text-anchor="middle" fill="#fff" font-size="13" font-weight="900" stroke="#000" stroke-width="0.5">${m.icon}</text>`;
    // 阵营徽章
    html += `<polygon points="${px-5},${py-12} ${px+5},${py-12} ${px},${py-16}" fill="${sideColor}"/>`;
    // 名字
    html += `<text x="${px}" y="${py+38}" text-anchor="middle" fill="#fff" font-size="10" font-weight="900" stroke="#000" stroke-width="2" paint-order="stroke">${m.name}</text>`;
    if (!isDead) {
      const hpColor = hpPct < 0.3 ? '#ef4444' : '#fff';
      html += `<text x="${px}" y="${py-22}" text-anchor="middle" fill="${hpColor}" font-size="10" font-weight="900" stroke="#000" stroke-width="2" paint-order="stroke">${Math.round(hp)}</text>`;
    }
    if (isDead) html += `<text x="${px+14}" y="${py-10}" fill="#475569" font-size="14">💀</text>`;
    html += `</g>`;
  });
  // 帧水印
  html += `<text x="${MAP_W-10}" y="${MAP_H-10}" text-anchor="end" fill="#75829a" font-size="10">${currentMode} · 真实引擎 · T+${currentFrame}/${TOTAL}</text>`;
  svg.innerHTML = html;
}

function renderEvents() {
  const el = document.getElementById('event-stream');
  const all = [];
  for (let i = 0; i <= currentFrame; i++) {
    for (const e of (FRAMES[i]?.events || [])) all.push({...e, t: i});
  }
  const recent = all.slice(-12).reverse();
  if (!recent.length) {
    el.innerHTML = '<div style="color:#75829a;font-size:11px;text-align:center;padding:10px;">等待事件...</div>';
    return;
  }
  el.innerHTML = recent.map(e => {
    const streak = e.streak >= 2 ? `<span class="event-streak">${e.label || ''}</span>` : '';
    const kCls = e.side === 'blue' ? 'event-killer' : 'event-victim';
    const vCls = e.side === 'blue' ? 'event-victim' : 'event-killer';
    let verb = '⚔击杀了';
    if (e.type === 'tower_destroyed') verb = '⚡摧毁了';
    else if (e.type === 'supply_pickup') {
      const info = SUPPLY_INFO[e.victim] || {};
      return `<div class="event-line">
        <span class="event-time">T+${e.t}s</span>
        <span style="color:${info.color || '#fff'}">${info.icon || '📦'} ${e.killer} 拾取 ${info.name || e.victim}</span>
      </div>`;
    }
    return `<div class="event-line">
      <span class="event-time">T+${e.t}s</span>
      <span class="${kCls}">${verb} ${e.killer}</span>
      ${e.victim && e.type !== 'supply_pickup' ? `<span class="event-arrow">→</span><span class="${vCls}">💀 ${e.victim}</span>` : ''}
      ${streak}
    </div>`;
  }).join('');
}

function renderCommentary() {
  const el = document.getElementById('commentary-list');
  const all = [];
  for (let i = 0; i <= currentFrame; i++) {
    for (const e of (FRAMES[i]?.events || [])) all.push({...e, t: i});
    for (const s of (FRAMES[i]?.streaks || [])) all.push({t:i, type:'streak_announce', killer:s.hero, label:s.label, side:s.side, streak:s.count});
  }
  const recent = all.slice(-6);
  if (!recent.length) {
    el.innerHTML = '<div style="color:#75829a;font-style:italic;">（等待精彩时刻...）</div>';
    return;
  }
  el.innerHTML = recent.map(e => {
    let text = '';
    if (e.type === 'streak_announce' && e.streak >= 3) text = `🔥 ${e.killer} ${e.label || 'LEGENDARY!'}!`;
    else if (e.type === 'streak_announce' && e.streak === 2) text = `⚡ ${e.killer} ${e.label || 'DOUBLE KILL!'}!`;
    else if (e.type === 'kill') text = `🗡 ${e.killer} 击杀了 ${e.victim}`;
    else if (e.type === 'tower_destroyed') text = `🏰 防御塔被摧毁！`;
    else if (e.type === 'supply_pickup') text = `📦 ${e.killer} 拾取了 ${e.victim}`;
    return `<div style="color:#e9f0ff;margin:2px 0;">${text}</div>`;
  }).join('');
}

function renderScore() {
  const f = getFrame();
  document.getElementById('score-blue').textContent = f.blue_kills;
  document.getElementById('score-red').textContent = f.red_kills;
  document.getElementById('kill-summary').textContent = `${f.blue_kills}/${f.red_kills}`;
  document.getElementById('tower-stat').textContent = `${f.tower_alive}/6`;
  let maxStreak = 0;
  for (let i = 0; i <= currentFrame; i++) {
    for (const s of (FRAMES[i]?.streaks || [])) if (s.count > maxStreak) maxStreak = s.count;
  }
  document.getElementById('streak-stat').textContent = maxStreak;
  document.getElementById('current-frame').textContent = currentFrame;
  document.getElementById('total-frames').textContent = TOTAL;
  const killRate = f.blue_kills / (f.blue_kills + f.red_kills + 0.001);
  winRate = Math.round(50 + (killRate - 0.5) * 30 + (f.tower_alive - 3) * 5);
  winRate = Math.max(5, Math.min(95, winRate));
  document.getElementById('win-rate').textContent = winRate + '%';
  const delta = winRate - lastWinRate;
  document.getElementById('win-delta').textContent = (delta >= 0 ? '+' : '') + delta + '%';
  document.getElementById('win-delta').style.color = delta >= 0 ? '#39daa0' : '#fb6470';
  document.getElementById('win-bar').style.width = winRate + '%';
  lastWinRate = winRate;
}

function showFlyBubble(text) {
  const host = document.getElementById('fly-bubble-host');
  const div = document.createElement('div');
  div.className = 'fly-bubble';
  div.textContent = text;
  host.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

function renderAll() {
  renderHeroes();
  renderBattle();
  renderEvents();
  renderCommentary();
  renderScore();
  const f = getFrame();
  for (const s of (f.streaks || [])) {
    if (s.count >= 2 && s.label) showFlyBubble(s.label);
  }
}

function setSpeed(s) {
  speed = s;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (s === 0.5) document.getElementById('sp-05').classList.add('active');
  if (s === 1) document.getElementById('sp-1').classList.add('active');
  if (s === 2) document.getElementById('sp-2').classList.add('active');
  if (interval) {
    clearInterval(interval);
    if (isPlaying) interval = setInterval(tick, 250 / speed);
  }
}

function togglePause() {
  isPlaying = !isPlaying;
  document.getElementById('btn-pause').textContent = isPlaying ? '⏸' : '▶';
  if (interval) clearInterval(interval);
  if (isPlaying) interval = setInterval(tick, 250 / speed);
}

function tick() {
  currentFrame++;
  if (currentFrame >= TOTAL) currentFrame = 0;
  renderAll();
}

// 启动
renderAll();
interval = setInterval(tick, 250);
</script>
