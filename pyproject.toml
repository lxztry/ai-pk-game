[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pk-game"
version = "0.1.0"
description = "AI竞技平台 - Prompt派 vs 代码派 同台 Battle"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "responses>=0.25",
    "freezegun>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: 慢测试（>5秒）",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "security: 安全测试",
    "performance: 性能测试",
    "fuzz: fuzz/属性测试",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:flask_cors",
    "ignore::DeprecationWarning:openai",
    # ResourceWarning 在测试中常见（sqlite3 连接），降级为警告
    "default::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["game", "agents", "online", "utils", "tournament", "visualizer"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "run_*.py",
    "gui/*",     # Tkinter 难以单元测试
    "examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
show_missing = true
skip_covered = false
# 当前覆盖：~31%（仅核心模块）。目标：60%（持续 PR 推进）
# game/agent.py: 100%, game/engine.py: 79%, online/database.py: 72%, utils/agent_loader.py: 72%
# 待补：tournament/*, visualizer/*, online/server.py, agents/prompt_agent.py
fail_under = 30
